[project]
name = "grok2api"
version = "2.0.0"
description = "Python/uv Grok2API wrapper with OpenAI-compatible APIs."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiofiles>=25.1.0",
    "aiohttp>=3.13.3",
    "aiohttp-socks>=0.11.0",
    "aiosqlite>=0.21.0",
    "beautifulsoup4>=4.12.3",
    "camoufox>=0.4.11",
    "cryptography>=46.0.5",
    "curl-cffi>=0.13.0",
    "fastapi>=0.119.0",
    "granian>=2.7.2",
    "greenlet>=3.3.1",
    "livekit>=1.0.25",
    "loguru>=0.7.3",
    "orjson>=3.11.4",
    "playwright>=1.58.0",
    "python-dotenv>=1.0.0",
    "python-multipart>=0.0.21",
    "quart>=0.20.0",
    "requests>=2.32.3",
    "rich>=14.3.2",
    "sqlalchemy>=2.0.46",
    "websockets>=16.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.0",
    "mypy>=1.19.0",
    "pytest>=9.0.0",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.15.0",
]

[project.scripts]
grok2api = "grok2api.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = [
    "scripts/turnstile_solver",
    "src/grok2api/api/v1",
    "src/grok2api/services",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.mypy]
python_version = "3.13"
packages = ["grok2api"]
ignore_missing_imports = true
warn_unused_ignores = false
